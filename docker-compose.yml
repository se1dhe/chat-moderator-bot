services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-redqueen}
      POSTGRES_USER: ${POSTGRES_USER:-redqueen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-redqueen}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Dev HTTPS tunnel so Telegram can reach the Mini App. Enable with:
  #   docker compose --profile tunnel up ngrok
  # Requires NGROK_AUTHTOKEN (and optionally NGROK_DOMAIN for a reserved domain) in .env.
  ngrok:
    image: ngrok/ngrok:latest
    # Reserved domain from your ngrok dashboard. For a random URL, drop --domain=...
    command: http --domain=${NGROK_DOMAIN} bot:8080
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"  # ngrok inspector / local API
    depends_on:
      - bot
    profiles: ["tunnel"]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    # On Apple Silicon run Ollama natively for GPU; this service is for Linux/servers.
    # The bot pulls OLLAMA_MODEL automatically on startup (OLLAMA_AUTO_PULL), so no
    # manual `ollama pull` is needed — just point OLLAMA_URL at http://ollama:11434.
    profiles: ["ai"]

  bot:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      OWNER_IDS: ${OWNER_IDS:-}
      BOT_BRAND: ${BOT_BRAND:-RedQueen}
      BOT_TOKENS: ${BOT_TOKENS:-}
      BOT_BRANDS: ${BOT_BRANDS:-}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-redqueen}
      POSTGRES_USER: ${POSTGRES_USER:-redqueen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_MAX_CONCURRENCY: ${AI_MAX_CONCURRENCY:-2}
      OLLAMA_AUTO_PULL: ${OLLAMA_AUTO_PULL:-true}
      WHISPER_MODEL: ${WHISPER_MODEL:-}
      RUN_MODE: ${RUN_MODE:-polling}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      WEBAPP_URL: ${WEBAPP_URL:-}
    ports:
      - "8080:8080"  # Mini App + API (and webhook in webhook mode)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  pgdata:
  ollama:
  prometheus_data:
  grafana_data:
