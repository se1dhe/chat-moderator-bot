[project]
name = "redqueen-security"
version = "0.1.0"
description = "RedQueen Security — advanced Telegram moderation SaaS bot built with aiogram 3.x."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiogram>=3.30,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "redis>=5.0",
    "pydantic-settings>=2.4",
    "aiohttp>=3.10",
    "cryptography>=50.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "aiosqlite>=0.20",
]
voice = [
    "faster-whisper>=1.0",
]

[project.scripts]
redqueen = "redqueen.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redqueen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
